<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GigCredit - Worker OTP Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Hanken+Grotesk:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#004ac6",
                        secondary: "#006c49",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#111c2d",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        background: "#f9f9ff",
                    },
                    fontFamily: {
                        body: ["Inter"],
                        headline: ["Hanken Grotesk"],
                        mono: ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body antialiased min-h-screen flex items-center justify-center p-4 sm:p-8">

<div class="max-w-5xl w-full bg-white rounded-3xl border border-outline-variant shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-12 min-h-[640px] animate-fade-in-up">

<!-- Left Panel: One-Click Demo Personas -->
<div class="lg:col-span-6 bg-slate-900 text-white p-8 sm:p-10 flex flex-col justify-between relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-blue-900/40 via-indigo-950/60 to-slate-950 pointer-events-none"></div>

<div class="relative z-10">
<div class="flex items-center gap-3 mb-8">
<div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white font-bold text-lg">G</div>
<span class="text-2xl font-headline font-extrabold text-white">GigCredit</span>
</div>

<h2 class="text-2xl font-headline font-bold mb-2 text-white">Try Demo Profiles</h2>
<p class="text-xs text-slate-300 mb-6">Click any demo worker or lender persona below to open their account instantly.</p>

<!-- Demo Worker Switcher Cards -->
<div class="space-y-3 max-h-[380px] overflow-y-auto pr-1" id="demo-cards-container">
<p class="text-xs text-slate-400">Loading demo accounts...</p>
</div>
</div>

<div class="relative z-10 pt-6 border-t border-slate-800 text-xs text-slate-400 flex justify-between items-center">
<span>Instant demo login</span>
<a class="text-primary font-semibold hover:underline" href="homepage.html">← Back to Home</a>
</div>
</div>

<!-- Right Panel: Phone + Aadhaar OTP Authentication Form -->
<div class="lg:col-span-6 p-8 sm:p-12 flex flex-col justify-center bg-white">
<div class="max-w-md w-full mx-auto space-y-6">
<div>
<h3 class="text-2xl font-headline font-bold text-on-surface mb-1" id="portal-heading">Worker OTP Sign In</h3>
<p class="text-xs text-on-surface-variant" id="portal-subheading">Enter your Mobile Number &amp; Aadhaar Number to get an OTP code.</p>
</div>

<!-- Role Selector Tabs -->
<div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
<button class="py-2.5 rounded-lg text-xs font-bold transition-all bg-white text-primary shadow-sm" id="role-btn-worker" onclick="switchRoleTab('worker')">
Worker OTP Sign In
</button>
<button class="py-2.5 rounded-lg text-xs font-bold transition-all text-on-surface-variant hover:text-primary" id="role-btn-lender" onclick="switchRoleTab('lender')">
Lender Portal
</button>
</div>

<!-- Error Alert -->
<div class="hidden bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs font-medium" id="auth-error"></div>

<!-- WORKER FORM: Phone + Aadhaar OTP -->
<div class="space-y-4" id="worker-otp-form">
<div>
<label class="block text-xs font-semibold text-on-surface mb-1">Mobile Number (+91)</label>
<input class="w-full bg-slate-50 border border-outline-variant rounded-xl text-xs px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="worker-phone" placeholder="+91 98765 43210" type="tel" value="+91 98765 43210"/>
</div>

<div>
<label class="block text-xs font-semibold text-on-surface mb-1">Aadhaar Number (12 Digits)</label>
<input class="w-full bg-slate-50 border border-outline-variant rounded-xl text-xs px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none font-mono" id="worker-aadhaar" placeholder="1234 5678 9924" type="text" value="1234 5678 9924"/>
</div>

<button class="w-full bg-primary text-white font-semibold text-xs py-3.5 rounded-xl hover:bg-blue-700 transition-all shadow-md shadow-primary/20 flex items-center justify-center gap-1.5" id="btn-send-worker-otp" onclick="handleSendWorkerOTP()">
<span class="material-symbols-outlined text-[18px]">sms</span> Get OTP Code
</button>

<div class="space-y-3 pt-2 hidden" id="otp-verify-section">
<div>
<label class="block text-xs font-semibold text-emerald-800 mb-1 flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Enter 6-Digit OTP (Test Code: <strong class="font-mono text-slate-900" id="suggested-otp">992410</strong>)
</label>
<input class="w-full bg-emerald-50/50 border border-emerald-300 rounded-xl text-sm px-4 py-3 focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 outline-none font-mono text-center font-bold tracking-widest text-emerald-900" id="worker-otp" placeholder="992410" type="text" value="992410"/>
</div>

<button class="w-full bg-emerald-600 text-white font-bold text-xs py-3.5 rounded-xl hover:bg-emerald-700 transition-all shadow-md shadow-emerald-600/20" onclick="handleVerifyWorkerOTP()">
⚡ Verify OTP &amp; Sign In
</button>
</div>
</div>

<!-- LENDER FORM: Institutional Email Login -->
<div class="space-y-4 hidden" id="lender-email-form">
<div>
<label class="block text-xs font-semibold text-on-surface mb-1">Institutional Email</label>
<input class="w-full bg-slate-50 border border-outline-variant rounded-xl text-xs px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="lender-email" placeholder="lender@institution.com" type="email" value="lender@institution.com"/>
</div>

<div>
<label class="block text-xs font-semibold text-on-surface mb-1">Password</label>
<input class="w-full bg-slate-50 border border-outline-variant rounded-xl text-xs px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none" id="lender-password" placeholder="••••••••" type="password" value="password123"/>
</div>

<button class="w-full bg-emerald-700 text-white font-semibold text-xs py-3.5 rounded-xl hover:bg-emerald-800 transition-all shadow-md shadow-emerald-700/20" onclick="handleLenderLogin()">
Sign In as Lender
</button>
</div>

</div>
</div>

</div>

<script src="js/api.js"></script>
<script>
let currentRole = 'worker';

function switchRoleTab(role) {
    currentRole = role;
    document.getElementById('role-btn-worker').className = role === 'worker' ? 'py-2.5 rounded-lg text-xs font-bold transition-all bg-white text-primary shadow-sm' : 'py-2.5 rounded-lg text-xs font-bold transition-all text-on-surface-variant hover:text-primary';
    document.getElementById('role-btn-lender').className = role === 'lender' ? 'py-2.5 rounded-lg text-xs font-bold transition-all bg-white text-emerald-700 shadow-sm' : 'py-2.5 rounded-lg text-xs font-bold transition-all text-on-surface-variant hover:text-primary';
    
    document.getElementById('portal-heading').textContent = role === 'worker' ? 'Worker OTP Sign In' : 'Lender Sign In';
    document.getElementById('portal-subheading').textContent = role === 'worker' ? 'Enter Mobile Number and Aadhaar Number.' : 'Sign in with your registered lender email.';

    document.getElementById('worker-otp-form').classList.toggle('hidden', role !== 'worker');
    document.getElementById('lender-email-form').classList.toggle('hidden', role !== 'lender');
    document.getElementById('auth-error').classList.add('hidden');
}

function handleSendWorkerOTP() {
    const phone = document.getElementById('worker-phone').value.trim();
    const aadhaar = document.getElementById('worker-aadhaar').value.trim();
    const errorEl = document.getElementById('auth-error');
    errorEl.classList.add('hidden');

    if (!phone || !aadhaar) {
        errorEl.textContent = 'Please enter both Mobile Number and Aadhaar Number.';
        errorEl.classList.remove('hidden');
        return;
    }

    document.getElementById('otp-verify-section').classList.remove('hidden');
    document.getElementById('btn-send-worker-otp').textContent = '✓ OTP Code Sent';
    document.getElementById('btn-send-worker-otp').className = 'w-full bg-slate-200 text-slate-700 font-semibold text-xs py-3.5 rounded-xl cursor-default';
}

async function handleVerifyWorkerOTP() {
    const phone = document.getElementById('worker-phone').value.trim();
    const aadhaar = document.getElementById('worker-aadhaar').value.trim();
    const otp = document.getElementById('worker-otp').value.trim() || '992410';
    const errorEl = document.getElementById('auth-error');
    errorEl.classList.add('hidden');

    try {
        const res = await GigCreditAPI.workerOTPLogin({ phone, aadhaarNumber: aadhaar, otp });
        GigCreditAPI.saveSession(res.token, 'worker', res.user);
        window.location.href = 'worker.html?onboard=true';
    } catch(err) {
        errorEl.textContent = err.message || 'OTP verification failed.';
        errorEl.classList.remove('hidden');
    }
}

async function handleLenderLogin() {
    const email = document.getElementById('lender-email').value.trim();
    const password = document.getElementById('lender-password').value;
    const errorEl = document.getElementById('auth-error');
    errorEl.classList.add('hidden');

    try {
        const res = await GigCreditAPI.login({ role: 'lender', email, password });
        GigCreditAPI.saveSession(res.token, 'lender', res.user);
        window.location.href = 'lender.html';
    } catch(err) {
        errorEl.textContent = err.message || 'Lender authentication failed.';
        errorEl.classList.remove('hidden');
    }
}

async function loadDemoAccounts() {
    try {
        const data = await GigCreditAPI.getDemoAccounts();
        const container = document.getElementById('demo-cards-container');
        container.innerHTML = '';

        // Worker personas
        (data.workers || []).forEach(w => {
            const card = document.createElement('div');
            card.className = 'p-3 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl flex items-center justify-between cursor-pointer transition-all hover:border-primary';
            card.onclick = () => quickDemoLogin(w.id, 'worker');
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${w.avatarUrl}" class="w-9 h-9 rounded-full object-cover border border-slate-600"/>
                    <div>
                        <div class="text-xs font-bold text-white flex items-center gap-2">
                            ${w.name}
                            <span class="text-[10px] px-2 py-0.5 bg-emerald-500/20 text-emerald-400 font-mono rounded">Score ${w.gigCreditScore}</span>
                        </div>
                        <div class="text-[11px] text-slate-400">${w.tagline || 'Worker'} • ₹${Number(w.monthlyIncome || 0).toLocaleString('en-IN')}/mo</div>
                    </div>
                </div>
                <span class="material-symbols-outlined text-slate-400 text-[18px]">arrow_forward</span>
            `;
            container.appendChild(card);
        });

        // Lender personas
        (data.lenders || []).forEach(l => {
            const card = document.createElement('div');
            card.className = 'p-3 bg-slate-800/80 hover:bg-slate-800 border border-emerald-500/30 rounded-xl flex items-center justify-between cursor-pointer transition-all hover:border-emerald-500';
            card.onclick = () => quickDemoLogin(l.id, 'lender');
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${l.avatarUrl}" class="w-9 h-9 rounded-full object-cover border border-emerald-500/40"/>
                    <div>
                        <div class="text-xs font-bold text-white flex items-center gap-2">
                            ${l.name}
                            <span class="text-[10px] px-2 py-0.5 bg-blue-500/20 text-blue-400 font-mono rounded">Lender</span>
                        </div>
                        <div class="text-[11px] text-slate-400">${l.institutionName}</div>
                    </div>
                </div>
                <span class="material-symbols-outlined text-emerald-400 text-[18px]">arrow_forward</span>
            `;
            container.appendChild(card);
        });
    } catch(err) {
        console.error('Error loading demo accounts:', err);
    }
}

async function quickDemoLogin(id, role) {
    try {
        const res = await GigCreditAPI.switchDemoAccount(id, role);
        GigCreditAPI.saveSession(res.token, res.role, res.user);
        window.location.href = role === 'lender' ? 'lender.html' : 'worker.html';
    } catch(err) {
        alert('Could not authenticate demo persona.');
    }
}

if (GigCreditAPI.isLoggedIn()) {
    window.location.href = GigCreditAPI.getRole() === 'lender' ? 'lender.html' : 'worker.html';
}

loadDemoAccounts();
</script>
</body>
</html>
